<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MI 咨询 · 多模态实时 demo</title>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --line:#242a33; --fg:#e6e9ee; --dim:#8b95a5;
          --chg:#5b9cf8; --aro:#f2a65a; --val:#5fd3a6; --ok:#5fd3a6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Segoe UI",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header span { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:340px 1fr; gap:16px; padding:16px; align-items:start; }
  @media (max-width:860px){ main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  video { width:100%; border-radius:8px; background:#000; aspect-ratio:4/3; object-fit:cover; }
  .row { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line);
           background:#222831; color:var(--fg); cursor:pointer; font-size:14px; }
  button:hover:not(:disabled) { background:#2b323d; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.rec { background:#7f1d2b; border-color:#a02437; }
  button.on { background:#1c4b3a; border-color:#2b7a5e; }
  .vol { height:6px; background:#0b0e12; border-radius:3px; overflow:hidden; margin-top:8px; }
  .vol i { display:block; height:100%; width:0; background:var(--ok); transition:width .08s linear; }
  .meter { margin:10px 0; }
  .meter .lab { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  .bar { height:8px; background:#0b0e12; border-radius:4px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; width:0; transition:width .4s ease; }
  .tag { margin-top:12px; padding:8px 10px; background:#0b0e12; border-radius:6px;
         font-size:12px; color:var(--dim); word-break:break-word; }
  #chat { max-height:64vh; overflow-y:auto; }
  .msg { margin-bottom:14px; }
  .who { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .bubble { margin-top:4px; padding:10px 12px; border-radius:8px; background:#1d232b; }
  .msg.client .bubble { background:#1a2430; }
  .hint { color:var(--dim); font-size:12px; }
  .err { color:#f2757a; }
  textarea { width:100%; background:#0b0e12; color:var(--fg); border:1px solid var(--line);
             border-radius:8px; padding:8px; resize:vertical; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>Motivational Interviewing · 多模态实时咨询</h1>
  <span id="status">未连接摄像头</span>
</header>

<main>
  <section class="panel">
    <video id="cam" autoplay muted playsinline></video>
    <div class="vol"><i id="vol"></i></div>
    <div class="row">
      <button id="btnCam">开启摄像头</button>
      <button id="btnAuto" disabled>自动对话</button>
    </div>
    <div class="row">
      <button id="btnRec" disabled>按住说话(手动)</button>
    </div>
    <div class="row">
      <textarea id="typed" rows="2" placeholder="也可以直接打字"></textarea>
    </div>
    <div class="row">
      <button id="btnSend">发送文字</button>
      <button id="btnReset">重置会话</button>
    </div>

    <div style="margin-top:16px">
      <div class="meter"><div class="lab"><span>change-readiness 改变意愿</span><b id="vchg">–</b></div>
        <div class="bar"><i id="bchg" style="background:var(--chg)"></i></div></div>
      <div class="meter"><div class="lab"><span>arousal 唤起度</span><b id="varo">–</b></div>
        <div class="bar"><i id="baro" style="background:var(--aro)"></i></div></div>
      <div class="meter"><div class="lab"><span>valence 效价</span><b id="vval">–</b></div>
        <div class="bar"><i id="bval" style="background:var(--val)"></i></div></div>
      <div class="tag" id="tag">评估器状态标记会显示在这里</div>
    </div>
  </section>

  <section class="panel">
    <div id="chat"><p class="hint">开启摄像头后点「自动对话」,直接说英文即可,停顿约 1.2 秒自动发送。<br>
      音频经 Whisper 转写并提取语音特征,画面经 CLIP 提取表情特征,
      两者与文本一起送入评估器得到状态 μ,再作为状态标记进入生成器的 prompt。</p></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const SESSION = "demo-" + Math.random().toString(36).slice(2, 8);
const SILENCE_MS = 1200;      // 停顿多久算说完
const MIN_SPEECH_MS = 600;    // 太短的片段丢弃(避免咳嗽/杂音触发)
const MAX_SPEECH_MS = 15000;  // 单段上限, 防止一直不停

let stream = null, rec = null, chunks = [], frames = [], grabTimer = null, busy = false;
let autoOn = false, speaking = false, lastLoud = 0, speechStart = 0;
let audioCtx = null, analyser = null, noiseFloor = 4;

function setStatus(t, err) { $("status").textContent = t; $("status").className = err ? "err" : ""; }

$("btnCam").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640 }, audio: true });
    $("cam").srcObject = stream;
    $("btnRec").disabled = false; $("btnAuto").disabled = false; $("btnCam").disabled = true;
    initVAD();
    setStatus("就绪 · 可点「自动对话」");
  } catch (e) { setStatus("无法访问摄像头/麦克风:" + e.message, true); }
};

// ---------- 音量检测 (VAD) ----------
function initVAD() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  // 用前 1 秒环境音标定噪声底
  const samples = [];
  const cal = setInterval(() => samples.push(rms()), 50);
  setTimeout(() => {
    clearInterval(cal);
    samples.sort((a, b) => a - b);
    noiseFloor = Math.max(3, samples[Math.floor(samples.length * 0.9)] || 4);
  }, 1000);
  requestAnimationFrame(vadLoop);
}

function rms() {
  const buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let s = 0;
  for (let i = 0; i < buf.length; i++) { const d = buf[i] - 128; s += d * d; }
  return Math.sqrt(s / buf.length);
}

function vadLoop() {
  if (!analyser) return;
  const v = rms();
  $("vol").style.width = Math.min(100, v * 4) + "%";
  if (autoOn && !busy) {
    const now = performance.now();
    const loud = v > noiseFloor * 1.8 + 2;
    if (loud) {
      if (!speaking) { speaking = true; speechStart = now; startRec(); setStatus("聆听中…"); }
      lastLoud = now;
    } else if (speaking) {
      if (now - lastLoud > SILENCE_MS) finishSegment(now);
    }
    if (speaking && now - speechStart > MAX_SPEECH_MS) finishSegment(now);
  }
  requestAnimationFrame(vadLoop);
}

function finishSegment(now) {
  speaking = false;
  if (now - speechStart < MIN_SPEECH_MS) { abortRec(); setStatus("(片段太短,已忽略)"); return; }
  stopRec();
}

$("btnAuto").onclick = () => {
  autoOn = !autoOn;
  $("btnAuto").classList.toggle("on", autoOn);
  $("btnAuto").textContent = autoOn ? "自动对话:开" : "自动对话";
  $("btnRec").disabled = autoOn;
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  setStatus(autoOn ? "自动模式 · 请开口说话" : "自动模式已关闭");
  if (!autoOn && speaking) { speaking = false; abortRec(); }
};

// ---------- 录音 ----------
function grabFrame() {
  const v = $("cam");
  if (!v.videoWidth) return null;
  const c = document.createElement("canvas");
  c.width = 224; c.height = 224;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8);
}

function startRec() {
  if (busy || !stream || (rec && rec.state === "recording")) return;
  chunks = []; frames = [];
  rec = new MediaRecorder(new MediaStream(stream.getAudioTracks()));
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    clearInterval(grabTimer);
    if (rec._aborted) return;
    const blob = new Blob(chunks, { type: "audio/webm" });
    if (blob.size < 2000) { setStatus("(几乎没有声音)"); return; }
    const fr = new FileReader();
    fr.onload = () => send({ audio: fr.result, frames });
    fr.readAsDataURL(blob);
  };
  rec.start();
  const f0 = grabFrame(); if (f0) frames.push(f0);
  grabTimer = setInterval(() => { if (frames.length < 8) { const f = grabFrame(); if (f) frames.push(f); } }, 400);
  $("btnRec").classList.add("rec");
}

function stopRec() {
  if (!rec || rec.state === "inactive") return;
  rec._aborted = false; rec.stop();
  $("btnRec").classList.remove("rec");
  setStatus("处理中…");
}

function abortRec() {
  if (!rec || rec.state === "inactive") return;
  rec._aborted = true; rec.stop();
  clearInterval(grabTimer);
  $("btnRec").classList.remove("rec");
}

const btn = $("btnRec");
btn.onmousedown = () => { if (!autoOn) startRec(); };
btn.onmouseup = () => { if (!autoOn) stopRec(); };
btn.onmouseleave = () => { if (!autoOn && rec && rec.state === "recording") stopRec(); };

$("btnSend").onclick = () => {
  const t = $("typed").value.trim();
  if (!t) return;
  const f = []; const one = grabFrame(); if (one) f.push(one);
  send({ text: t, frames: f });
  $("typed").value = "";
};

$("btnReset").onclick = async () => {
  await fetch("/reset", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ session_id: SESSION }) });
  $("chat").innerHTML = '<p class="hint">会话已重置。</p>';
  setStatus("会话已重置");
};

function addMsg(who, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
  d.querySelector(".bubble").textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function setMeters(mu, tag) {
  for (const k of ["chg", "aro", "val"]) {
    $("v" + k).textContent = mu[k].toFixed(3);
    $("b" + k).style.width = Math.max(2, Math.min(100, mu[k] * 100)) + "%";
  }
  $("tag").textContent = tag;
}

async function send(payload) {
  if (busy) return;
  busy = true; $("btnSend").disabled = true;
  const t0 = performance.now();
  try {
    const r = await fetch("/infer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ session_id: SESSION, max_new_tokens: 160 }, payload))
    });
    const j = await r.json();
    if (j.error) { setStatus(j.error, true); }
    else {
      addMsg("来访者" + (j.asr ? "(语音转写)" : ""), j.user_text, "client");
      setMeters(j.mu, j.tag);
      addMsg("咨询师", j.reply);
      setStatus(`第 ${j.turn} 轮 · ${((performance.now() - t0) / 1000).toFixed(1)}s` +
                (autoOn ? " · 继续说话即可" : ""));
    }
  } catch (e) { setStatus("请求失败:" + e.message, true); }
  busy = false; $("btnSend").disabled = false;
  lastLoud = performance.now();     // 避免回复刚出来就被余音触发
}
</script>
</body>
</html>
