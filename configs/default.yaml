# configs/default.yaml
session:
  id: "ALL" 

pipeline:
  run_extract_wav: false
  run_build_turns: false
  run_build_mpse_npz: false
  run_upgrade: false
  run_train_mpse: false

  run_build_sft: false
  run_mm_cache: false

  run_train_mm_sft: true
  # 关键：保护你手改的 turns_upgraded.jsonl
  # overwrite: 每次都重建（会重置）
  # skip_if_exists: 如果 outputs/upgrade/<sid>/turns_upgraded.jsonl 已存在就不覆盖
  upgraded_policy: "skip_if_exists"


paths:
  raw_video: "data/raw/{session_id}.mp4"
  work_dir: "data/derived/{session_id}"
  outputs_dir: "outputs"

segment:
  target_turns: 0
  wav_sr: 16000
  vad:
    frame_ms: 30
    thr: 0.00005
    min_speech_ms: 250
    min_silence_ms: 800
    merge_gap_sec: 0
    force_single_turn: false

# 新增：对话数据模式（人-机交替） （目前数据处理逻辑用不上，可以忽略这一部分）
dialogue:
  enabled: false          # 先默认关；你换成新视频时改 true
  mode: "alternating"     # 当前先做最简单可靠的交替分配 role
  start_role: "assistant"      # 第一个 VAD 段是谁（通常是 user）
  keep_role: "user"       # MPSE/upgrade 只吃 user 段，避免污染相邻 mu 差值
  export_all_turns: true  # 导出 turns_all.jsonl（带 role）便于 debug
  export_pairs: true      # 导出 pairs.jsonl（user_turn -> assistant_text）用于 SFT
  target_user_turns: null   # 语义切换：只限制 user turn 数

asr:
  enabled: true
  # IMPORTANT: set to your local CT2 faster-whisper model directory
  model_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/faster_whisper/pengzhendong/faster-whisper-small"
  device: "cuda"      # set "cuda" if your CUDA runtime is correct
  compute_type: "int8"

agents:
  # Three weak supervision sources
  use_llm_text_rater: true
  # If false, text rater becomes a simple rule-based rater.
  use_audio_heuristic: true
  use_video_heuristic: true

llm:
  # used by text-rater agent (and optional SFT baseline)
  # IMPORTANT: set to your local LLM dir (ModelScope snapshot dir)
  model_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/Qwen3-8B/Qwen/Qwen3-8B"
  device: "cuda"  # "cpu" or "cuda"
  max_new_tokens: 128

indices:
  names: ["dep", "sad", "anx", "stress", "microexpr_rate"]
  # default thresholds (soft stop only)
  tau:
    dep: 0.30
    sad: 0.30
    anx: 0.30
    stress: 0.30
    microexpr_rate: 0.30



mpse:
  epochs: 5
  batch_size: 8
  lr: 3.0e-4
  hidden_dim: 256
  dropout: 0.1
  use_pretrained_encoders: true
  encoders:
    text_model_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/Qwen3-8B/Qwen/Qwen3-8B"
    audio_model_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/whisper-small/openai-mirror/whisper-small"
    video_model_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/clip-vit-base-patch32/openai-mirror/clip-vit-base-patch32"

upgrade:
  # how much to penalize uncertainty for sample weighting
  sigma_lambda: 2.0
  # treat improvements as trusted only if sigma below this
  sigma_max: 0.12
  # output whether to inject state tokens into SFT prompt
  inject_state_tokens: true

sft:
  # text-only baseline (optional)
  enabled: false
  max_seq_len: 1024


mm:
  enabled: true
  whisper_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/whisper-small/openai-mirror/whisper-small"
  clip_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/clip-vit-base-patch32/openai-mirror/clip-vit-base-patch32"
  n_frames: 8
  k_audio: 8
  k_video: 8
  device: "cuda"

teacher:
  enabled: false
  base_model_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/Qwen3-8B/Qwen/Qwen3-8B"
  device: "cuda"
  max_new_tokens: 128

mm_sft:
  enabled: true
  base_model_dir: "/home/qmn/Yuan-chat/MPSE_FULL_LOOP_PROJECT/models/Qwen3-8B/Qwen/Qwen3-8B"
  out_dir: "outputs/mm_sft/{session_id}"
  batch_size: 1
  lr: 0.0002
  epochs: 1
  max_len: 1024
